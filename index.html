<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logica Programacion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Ordenador de Números</h1>
        <button id="btnIniciar" class="btn">Empezar</button>
        <div id="contenedorResultados" class="results hidden">
            <p id="ordenMayor"></p>
            <p id="ordenMenor"></p>
            <p id="mensajeIguales" style="color: #d9534f; font-weight: bold;"></p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const boton = document.getElementById('btnIniciar');
            const contenedorResultados = document.getElementById('contenedorResultados');
            const mensajeIguales = document.getElementById('mensajeIguales');
            
            boton.addEventListener('click', () => {
                let n1 = Number(prompt("Ingresa el primer número:"));
                let n2 = Number(prompt("Ingresa el segundo número:"));
                let n3 = Number(prompt("Ingresa el tercer número:"));

                if (isNaN(n1) || isNaN(n2) || isNaN(n3)) {
                    alert("Error: Ingresa solo números");
                    return;
                }

                const nums = [n1, n2, n3];
                const mayorAMenor = [...nums].sort((a, b) => b - a);
                const menorAMayor = [...nums].sort((a, b) => a - b);

                let textoMensaje = "";
                
                if (n1 === n2 && n2 === n3) {
                    textoMensaje = "Los tres números son iguales.";
                } else if (n1 === n2 || n1 === n3 || n2 === n3) {
                    textoMensaje = "Hay dos números iguales.";
                }

                if (textoMensaje !== "") {
                    console.log(textoMensaje);
                    mensajeIguales.innerText = textoMensaje;
                } else {
                    mensajeIguales.innerText = "";
                }

                console.log("Mayor a menor:", mayorAMenor.join(", "));
                console.log("Menor a mayor:", menorAMayor.join(", "));

                document.getElementById('ordenMayor').innerText = "Mayor a menor: " + mayorAMenor.join(", ");
                document.getElementById('ordenMenor').innerText = "Menor a mayor: " + menorAMayor.join(", ");
                contenedorResultados.classList.remove('hidden');
            });
        });
    </script>
</body>
</html>
